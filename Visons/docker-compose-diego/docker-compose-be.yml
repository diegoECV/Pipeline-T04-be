version: '3.8'

services:
  visons-app:
    build: ..
    # image: diego/springboot-sqlserver:1.0  # cambiar tagname según sea necesario
    container_name: visons-backend-diego
    ports:
      - "9090:9090"

    environment:
      DB_URL: "jdbc:sqlserver://mssql-server:1433;databaseName=Visons;encrypt=true;trustServerCertificate=true"
      DB_USER: "sa"
      DB_PASSWORD: "Admin12345!"
      DB_DRIVER: "com.microsoft.sqlserver.jdbc.SQLServerDriver"
      PORT: "9090"
      SERVER_URL: "http://localhost:9090"

      MAIL_HOST: "smtp.gmail.com"
      MAIL_PORT: "587"

      MAIL_USERNAME: "lizeth.quispe@vallegrande.edu.pe"
      MAIL_PASSWORD: "fecpfmmawlxxdcua"

      MAIL_SMTP_AUTH: "true"
      MAIL_SMTP_STARTTLS: "true"

      MAIL_FROM: "lizeth.quispe@vallegrande.edu.pe"

    networks:
      - visons-network
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/swagger-ui.html"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

# CONSUMIR UNA RED EXISTENTE CREADA POR OTRO COMPOSE
networks:
  visons-network:
    external: true   # usa la red creada por el compose de la base de datos


