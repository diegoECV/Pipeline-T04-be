name: Docker Hub

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # 08:00 AM Peru time (UTC-5) = 01:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_DIEGO }}
          password: ${{ secrets.DOCKERHUB_TOKEN_DIEGO }}

      - name: Build Docker Image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Visons/dockerfile-diego/dockerfile
          push: false
          tags: pipeline-t04-be:pr-${{ github.event.pull_request.number }}

      - name: Build and Push Docker Image to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Visons/dockerfile-diego/dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME_DIEGO }}/pipeline-t04-be:latest
            ${{ secrets.DOCKERHUB_USERNAME_DIEGO }}/pipeline-t04-be:${{ github.sha }}
